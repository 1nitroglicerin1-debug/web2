<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Генератор постеров для лабы</title>
	<style>
		body {
			background-color: #12151c;
			color: #fff;
			font-family: Arial, sans-serif;
			padding: 30px;
			text-align: center;
		}
		h1 {
			margin-bottom: 20px;
		}
		.btn-all {
			padding: 12px 25px;
			font-size: 16px;
			font-weight: bold;
			background-color: #ed8936;
			color: #fff;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			margin-bottom: 30px;
		}
		.btn-all:hover {
			background-color: #dd6b20;
		}
		.grid {
			display: flex;
			justify-content: center;
			gap: 20px;
			flex-wrap: wrap;
		}
		.card {
			background: #1a202c;
			padding: 15px;
			border-radius: 8px;
			border: 1px solid #2d3748;
		}
		canvas {
			display: block;
			margin: 0 auto 10px;
			border-radius: 4px;
		}
		.btn-single {
			padding: 8px 15px;
			background: #2d3748;
			color: #edf2f7;
			border: 1px solid #4a5568;
			border-radius: 4px;
			cursor: pointer;
		}
		.btn-single:hover {
			background: #ed8936;
			border-color: #ed8936;
		}
	</style>
</head>
<body>

	<h1>Генератор постеров для Kinobase</h1>
	<button class="btn-all" onclick="downloadAll()">Скачать все 4 постера сразу</button>

	<div class="grid">
		<div class="card">
			<canvas id="poster-interstellar" width="300" height="420"></canvas>
			<button class="btn-single" onclick="downloadPoster('poster-interstellar.jpg')">Скачать</button>
		</div>

		<div class="card">
			<canvas id="poster-inception" width="300" height="420"></canvas>
			<button class="btn-single" onclick="downloadPoster('poster-inception.jpg')">Скачать</button>
		</div>

		<div class="card">
			<canvas id="poster-matrix" width="300" height="420"></canvas>
			<button class="btn-single" onclick="downloadPoster('poster-matrix.jpg')">Скачать</button>
		</div>

		<div class="card">
			<canvas id="poster-gladiator" width="300" height="420"></canvas>
			<button class="btn-single" onclick="downloadPoster('poster-gladiator.jpg')">Скачать</button>
		</div>
	</div>

	<script>
		const posters = [
			{
				id: 'poster-interstellar',
				filename: 'poster-interstellar.jpg',
				title: 'INTERSTELLAR',
				year: '2014',
				genre: 'SCI-FI / DRAMA',
				bgGrad: ['#040b14', '#0d223a', '#1a365d'],
				accent: '#63b3ed'
			},
			{
				id: 'poster-inception',
				filename: 'poster-inception.jpg',
				title: 'INCEPTION',
				year: '2010',
				genre: 'ACTION / SCI-FI',
				bgGrad: ['#171923', '#2d3748', '#4a5568'],
				accent: '#e2e8f0'
			},
			{
				id: 'poster-matrix',
				filename: 'poster-matrix.jpg',
				title: 'THE MATRIX',
				year: '1999',
				genre: 'CYBERPUNK / ACTION',
				bgGrad: ['#021207', '#082f14', '#0f4d22'],
				accent: '#48bb78'
			},
			{
				id: 'poster-gladiator',
				filename: 'poster-gladiator.jpg',
				title: 'GLADIATOR',
				year: '2000',
				genre: 'ACTION / DRAMA',
				bgGrad: ['#1a0c02', '#3d1d05', '#652b08'],
				accent: '#ed8936'
			}
		];

		function drawPoster(p) {
			const canvas = document.getElementById(p.id);
			const ctx = canvas.getContext('2d');

			// Градиент фона
			const grad = ctx.createLinearGradient(0, 0, 0, 420);
			grad.addColorStop(0, p.bgGrad[0]);
			grad.addColorStop(0.5, p.bgGrad[1]);
			grad.addColorStop(1, p.bgGrad[2]);
			ctx.fillStyle = grad;
			ctx.fillRect(0, 0, 300, 420);

			// Внутренняя рамка
			ctx.strokeStyle = p.accent;
			ctx.lineWidth = 2;
			ctx.strokeRect(15, 15, 270, 390);

			// Плашка по центру
			ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
			ctx.fillRect(20, 160, 260, 100);

			// Название фильма
			ctx.fillStyle = '#ffffff';
			ctx.font = 'bold 22px Arial';
			ctx.textAlign = 'center';
			ctx.fillText(p.title, 150, 205);

			// Год и жанр
			ctx.fillStyle = p.accent;
			ctx.font = 'bold 13px Arial';
			ctx.fillText(p.year + ' • ' + p.genre, 150, 235);

			// Декоративная полоса
			ctx.fillStyle = p.accent;
			ctx.fillRect(110, 250, 80, 2);
		}

		posters.forEach(drawPoster);

		function downloadPoster(filename) {
			const p = posters.find(item => item.filename === filename);
			const canvas = document.getElementById(p.id);
			const link = document.createElement('a');
			link.download = filename;
			link.href = canvas.toDataURL('image/jpeg', 0.9);
			link.click();
		}

		function downloadAll() {
			posters.forEach((p, idx) => {
				setTimeout(() => {
					downloadPoster(p.filename);
				}, idx * 250);
			});
		}
	</script>
</body>
</html>
