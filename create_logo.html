<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Генератор logo.png</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">

    <h2>Твой логотип Kinobase:</h2>
    <canvas id="canvas" width="64" height="64" style="border: 1px solid #444; margin: 15px; border-radius: 8px;"></canvas>
    <br>
    <button id="downloadBtn" style="padding: 10px 20px; font-size: 16px; background: #ed8936; border: none; color: #fff; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Скачать logo.png
    </button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Фон - темный скругленный квадрат
        ctx.fillStyle = '#1a202c';
        ctx.beginPath();
        ctx.roundRect(0, 0, 64, 64, 12);
        ctx.fill();

        // Оранжевая рамка
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ed8936';
        ctx.stroke();

        // Кинопленка / треугольник Play
        ctx.fillStyle = '#ed8936';
        ctx.beginPath();
        ctx.moveTo(24, 16);
        ctx.lineTo(48, 32);
        ctx.lineTo(24, 48);
        ctx.closePath();
        ctx.fill();

        // Кнопка автоматического скачивания
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'logo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
